# nginx config for the frontend container.
# Serves the built Vite assets and proxies /api/* to the FastAPI backend.
# proxy_buffering off is required so SSE chunks stream through immediately.

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Streaming responses: disable buffering at every layer.
    proxy_buffering off;
    proxy_cache off;
    proxy_set_header Connection "";
    proxy_http_version 1.1;
    chunked_transfer_encoding on;

    # API → backend service (service name resolves via docker-compose network).
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # SSE: no timeout while waiting for tokens.
        proxy_read_timeout 300s;
    }

    # Static assets — long cache, immutable.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # SPA fallback.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
