<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Content Studio — AI Generator</title>

    <meta
      name="description"
      content="Generate content in real time with an AI model. Streaming responses, clean UI, secure backend."
    />

    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap"
      rel="stylesheet"
    />

    <link rel="stylesheet" href="/styles.css" />
  </head>

  <body>
    <div class="app">
      <header class="topbar">
        <div class="brand">
          <span class="brand-mark">✦</span>
          <span class="brand-name">Content Studio</span>
        </div>

        <nav class="topbar-nav">
          <span
            id="status-pill"
            class="pill pill--unknown"
            title="Backend status"
          >
            <span class="pill-dot"></span>
            <span class="pill-text">Checking...</span>
          </span>
        </nav>
      </header>

      <main class="layout">
        <section class="panel panel--composer">
          <div class="panel-head">
            <h1>Compose</h1>

            <p class="muted">
              Describe what you want to generate. Responses stream live from the
              configured AI model.
            </p>
          </div>

          <form id="gen-form" class="composer">
            <label class="field">
              <span class="field-label">Prompt</span>

              <textarea
                id="prompt"
                name="prompt"
                rows="8"
                placeholder="Write a landing page hero for a sustainable coffee brand..."
                required
              ></textarea>
            </label>

            <div class="controls">
              <label class="field field--inline">
                <span class="field-label">
                  Temperature
                  <span id="temp-val" class="muted">0.7</span>
                </span>

                <input
                  id="temperature"
                  name="temperature"
                  type="range"
                  min="0"
                  max="2"
                  step="0.1"
                  value="0.7"
                />
              </label>

              <label class="field field--inline">
                <span class="field-label">Max Tokens</span>

                <input
                  id="max-tokens"
                  name="max_tokens"
                  type="number"
                  min="1"
                  max="8192"
                  value="2048"
                />
              </label>
            </div>

            <div class="actions">
              <button
                id="submit-btn"
                type="submit"
                class="btn btn--primary"
              >
                <span class="btn-label">Generate</span>
                <span class="btn-spinner"></span>
              </button>

              <button
                id="stop-btn"
                type="button"
                class="btn btn--ghost"
                disabled
              >
                Stop
              </button>

              <button
                id="clear-btn"
                type="button"
                class="btn btn--ghost"
              >
                Clear
              </button>
            </div>

            <div
              id="error-banner"
              class="banner banner--error"
              hidden
            ></div>
          </form>

          <div class="presets">
            <span class="muted">Try:</span>

            <button class="chip" data-preset="blog">
              Blog outline
            </button>

            <button class="chip" data-preset="tagline">
              Product taglines
            </button>

            <button class="chip" data-preset="email">
              Cold email
            </button>

            <button class="chip" data-preset="recipe">
              Recipe
            </button>
          </div>
        </section>

        <section class="panel panel--output">
          <div class="panel-head">
            <h2>Output</h2>

            <button
              id="copy-btn"
              class="btn btn--ghost btn--sm"
              disabled
            >
              Copy
            </button>
          </div>

          <div id="output" class="output">
            <div class="output-empty muted">
              Your generated content will appear here, streaming token by token.
            </div>
          </div>
        </section>
      </main>

      <footer class="footer">
        <span class="muted">
          Powered by Groq • FastAPI • Secure server-side API keys
        </span>
      </footer>
    </div>

    <script type="module" src="/main.js"></script>
  </body>
</html>
